<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>申请试用 · 页序</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../site.css">
<link rel="stylesheet" href="order.css?v=2">
<script src="order.js?v=2" defer></script>
</head>
<body>
<header class="shell top"><a class="brand" href="../" aria-label="页序首页"><span class="mark" aria-hidden="true"></span>页序</a><span>演示试用</span></header>
<main class="shell request">
<section class="intro" aria-labelledby="request-title"><p class="label">网页演示流水线</p><h1 id="request-title">申请演示试用</h1><p class="lead">告诉我们你想讲什么，我们会通过邮件和你联系。</p></section>
<form id="request-form">
<label for="material">演示材料</label>
<textarea id="material" name="material" placeholder="粘贴原始材料，也可以附上用途、听众和想强调的内容。" maxlength="18000" rows="8" required></textarea>
<div class="fields">

<div><label for="pages">总页数</label><select id="pages" name="pages" required aria-describedby="page-detail"></select><small id="page-detail">按成品总页数计算，含封面与目录（如有）。</small></div>
<div><label for="email">联系邮箱</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="输入常用邮箱" required></div>
</div>
<div class="payment-choice">
<label for="payment">偏好的付款方式 <span class="optional">选填</span></label>
<select id="payment" name="payment">
<option value="">请选择</option>
<option value="wechat">微信支付</option>
<option value="alipay">支付宝</option>
<option value="paypal">PayPal</option>
</select>
</div>
<div class="submit-row">
<button class="primary" id="send" type="submit" disabled>提交申请 <span aria-hidden="true">↗</span></button>
</div>
<p id="feedback" role="status"></p>
<small class="order-privacy">请勿提交敏感或保密材料。申请通过 FormSubmit 转发。</small>
<div hidden><label for="company">公司网站</label><input id="company" name="company" tabindex="-1" autocomplete="off"></div>
</form>
<section class="receipt" id="receipt" tabindex="-1" hidden><h2>申请已提交</h2><p>谢谢你试用页序。我们会通过你填写的邮箱联系你。</p></section>
</main>
</body>
</html>
